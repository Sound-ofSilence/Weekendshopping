services:
  weekend-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: weekend-api
    restart: always
    env_file: .env.prod
    depends_on:
      weekend-postgres:
        condition: service_healthy
      weekend-redis:
        condition: service_healthy
      weekend-rabbitmq:
        condition: service_healthy
    networks:
      - weekend-net
    mem_limit: 768m

  weekend-web:
    build:
      context: .
      dockerfile: apps/web-buyer/Dockerfile
    container_name: weekend-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_BASE: /api
    depends_on:
      - weekend-api
    networks:
      - weekend-net
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  weekend-postgres:
    image: postgres:15-alpine
    container_name: weekend-postgres
    restart: always
    environment:
      POSTGRES_USER: weekend
      POSTGRES_PASSWORD: WeekendPg2026Prod
      POSTGRES_DB: weekend
    volumes:
      - weekend_pg_data:/var/lib/postgresql/data
    networks:
      - weekend-net
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weekend -d weekend"]
      interval: 10s
      timeout: 5s
      retries: 5

  weekend-redis:
    image: redis:7-alpine
    container_name: weekend-redis
    restart: always
    volumes:
      - weekend_redis_data:/data
    networks:
      - weekend-net
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  weekend-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: weekend-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: weekend
      RABBITMQ_DEFAULT_PASS: WeekendMq2026Prod
    volumes:
      - weekend_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - weekend-net
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  weekend-nginx:
    image: nginx:alpine
    container_name: weekend-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - weekend-api
      - weekend-web
    networks:
      - weekend-net
    mem_limit: 64m

networks:
  weekend-net:
    name: weekend-net
    driver: bridge

volumes:
  weekend_pg_data:
  weekend_redis_data:
  weekend_rabbitmq_data: